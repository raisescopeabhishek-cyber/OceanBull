<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f5f9" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap"
    />

    <title>Ocean Bull</title>

    <!--
      Paint the stored theme before first render, so the page never flashes
      the wrong one. Light is the default; the attribute is only set when a
      choice has been stored, which lets the OS preference apply otherwise.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ob_theme_mode");
          if (stored === "light" || stored === "dark") {
            document.documentElement.setAttribute("data-theme", stored);
            document.documentElement.style.colorScheme = stored;
          }
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0a111f" : "#f3f5f9");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
